<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A calm planner: projects with notes, to-dos and a calendar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Margin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ee">
<script>
  document.documentElement.dataset.theme = localStorage.getItem('margin-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.querySelector('meta[name=theme-color]').content = document.documentElement.dataset.theme === 'dark' ? '#121317' : '#f7f4ee';
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <button class="icon-btn" data-act="toggleNav" aria-label="Menu">☰</button>
  <span class="serif tb-title" id="tbTitle">Margin</span>
  <button class="icon-btn" data-act="palette" aria-label="Search">⌕</button>
</header>
<aside id="side"></aside>
<main id="main"></main>
<aside id="right"></aside>
<div id="scrim" data-act="toggleNav"></div>
<div id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
